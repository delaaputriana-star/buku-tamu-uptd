<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu Digital</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>BUKU TAMU DIGITAL</h1>

<h3>
UPTD Laboratorium Lingkungan Hidup
Provinsi Sulawesi Selatan
</h3>

<form id="guestForm">

<input type="text"
id="nama"
placeholder="Nama Lengkap"
required>

<input type="text"
id="instansi"
placeholder="Instansi"
required>

<textarea
id="alamat"
placeholder="Alamat Instansi"
required></textarea>

<input
type="tel"
id="hp"
placeholder="Nomor HP"
required>

<input
type="date"
id="tanggal"
required>

<select id="tujuan" required>

<option value="">Pilih Tujuan</option>

<option>Konsultasi</option>

<option>Penyerahan Sampel</option>

<option>Pengambilan Hasil</option>

<option>Pengaduan</option>

<option>Lainnya</option>

</select>

<button>

Kirim

</button>

</form>

<p id="status"></p>

</div>

<script src="script.js"></script>

</body>

</html>
