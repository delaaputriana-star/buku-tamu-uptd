<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container py-5">

<div class="card shadow-lg border-0">

<div class="card-header bg-success text-white text-center">

<img src="logo.png" width="80">

<h2 class="mt-3">BUKU TAMU DIGITAL</h2>

<h5>UPTD Laboratorium Lingkungan Hidup</h5>

<p>Provinsi Sulawesi Selatan</p>

</div>

<div class="card-body">

<form id="guestForm">

<div class="mb-3">

<label>Nama Lengkap</label>

<input type="text"
class="form-control"
id="nama"
required>

</div>

<div class="mb-3">

<label>Instansi</label>

<input
type="text"
class="form-control"
id="instansi"
required>

</div>

<div class="mb-3">

<label>Alamat Instansi</label>

<textarea
class="form-control"
id="alamat"
required></textarea>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Nomor HP</label>

<input
type="text"
class="form-control"
id="hp">

</div>

<div class="col-md-6 mb-3">

<label>Tanggal</label>

<input
type="date"
class="form-control"
id="tanggal">

</div>

</div>

</div>

<div class="mt-3">

<label>Tujuan</label>

<select
class="form-select"
id="tujuan"
required>

<option value="">Pilih Tujuan</option>

<option>Konsultasi</option>

<option>Penyerahan Sampel</option>

<option>Pengambilan Hasil</option>

<option>Pengaduan</option>

<option>Lainnya</option>

</select>

</div>

<div class="d-grid mt-4">

<button class="btn btn-success btn-lg">

Kirim Data

</button>

</div>

</form>

<div id="status"
class="text-center mt-3"></div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
